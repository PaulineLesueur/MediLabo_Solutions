services:
  mysqldb:
    image: mysql:8.0.34
    volumes: 
      - mysql_data:/var/lib/mysql
      - ./ms-patient/database/data.sql:/docker-entrypoint-initdb.d/data.sql
    restart: always
    ports:
      - '3307:3306'
    environment:
      MYSQL_DATABASE: medilabo_solutions
      MYSQL_ROOT_PASSWORD: rootroot
      MYSQL_USER: app_user
      MYSQL_PASSWORD: rootroot

  ms-patient:
    image: ms-patient
    depends_on:
      - mysqldb
    restart: always
    ports:
      - '8081:8081'
    environment:
      MYSQL_URL: jdbc:mysql://mysqldb:3306/medilabo_solutions?serverTimezone=UTC
      MYSQL_USER: app_user
      MYSQL_PASSWORD: rootroot
      MYSQL_PORT: '3307'

volumes: 
  mysql_data: { }