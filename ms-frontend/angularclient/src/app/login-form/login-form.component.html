<section class="login-form">
    <h3>Sign in</h3>
    <form >
        <div class="field">
            <label for="username">Username</label>
            <input id="username" [(ngModel)]="username" name="username" placeholder="Username" required />
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Password" required />
        </div>
        <button (click)="onLogin()" type="submit">Sign in</button>
    </form>
</section>
